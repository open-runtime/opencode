name: Release Fork

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.1.48-open-runtime-fork.1)"
        required: true
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: OpenCode Fork v${{ steps.version.outputs.version }}
          draft: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          body: |
            ## OpenCode Fork Release v${{ steps.version.outputs.version }}

            This is a custom build from [open-runtime/opencode](https://github.com/open-runtime/opencode).

            ### Downloads

            | Platform | Architecture | Download |
            |----------|--------------|----------|
            | Linux | x64 | `opencode-linux-x64.tar.gz` |
            | macOS | x64 (Intel) | `opencode-darwin-x64.zip` |
            | macOS | arm64 (Apple Silicon) | `opencode-darwin-arm64.zip` |
            | Windows | x64 | `opencode-windows-x64.zip` |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            ext: tar.gz
          - os: macos-latest
            platform: darwin
            arch: arm64
            ext: zip
          - os: macos-13
            platform: darwin
            arch: x64
            ext: zip
          - os: windows-latest
            platform: windows
            arch: x64
            ext: zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install

      - name: Build CLI
        run: |
          cd packages/opencode
          bun run script/build.ts --single
        env:
          OPENCODE_VERSION: ${{ needs.create-release.outputs.version }}
          OPENCODE_CHANNEL: latest

      - name: List dist directory
        shell: bash
        run: |
          echo "Contents of packages/opencode/dist:"
          ls -la packages/opencode/dist/ || echo "dist directory not found"
          echo "Looking for opencode-${{ matrix.platform }}-${{ matrix.arch }}:"
          ls -la packages/opencode/dist/opencode-${{ matrix.platform }}-${{ matrix.arch }}/ || echo "target directory not found"

      - name: Package artifact (tar.gz)
        if: matrix.ext == 'tar.gz'
        run: |
          cd packages/opencode/dist/opencode-${{ matrix.platform }}-${{ matrix.arch }}/bin
          tar -czf ../../../opencode-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz *

      - name: Package artifact (zip - Unix)
        if: matrix.ext == 'zip' && matrix.os != 'windows-latest'
        run: |
          cd packages/opencode/dist/opencode-${{ matrix.platform }}-${{ matrix.arch }}/bin
          zip -r ../../../opencode-${{ matrix.platform }}-${{ matrix.arch }}.zip *

      - name: Package artifact (zip - Windows)
        if: matrix.ext == 'zip' && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd packages/opencode/dist/opencode-${{ matrix.platform }}-${{ matrix.arch }}/bin
          Compress-Archive -Path * -DestinationPath ../../../opencode-${{ matrix.platform }}-${{ matrix.arch }}.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: packages/opencode/dist/opencode-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
